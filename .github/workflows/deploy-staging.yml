name: Deploy to Staging

on:
  push:
    branches: ["staging"]
  workflow_dispatch:

concurrency:
  group: "staging"
  cancel-in-progress: true

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL_STAGING }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_STAGING }}

      - name: Deploy to Netlify
        id: netlify_deploy
        run: |
          npx netlify-cli deploy \
            --no-build \
            --dir=dist \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --prod \
            --json > netlify-deploy.json
          cat netlify-deploy.json
          DEPLOY_URL=$(node -e "console.log(require('./netlify-deploy.json').deploy_url || require('./netlify-deploy.json').url)")
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests against staging
        id: playwright
        run: npm test
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.netlify_deploy.outputs.deploy_url }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL_STAGING }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_STAGING }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_STAGING }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Write summary
        if: always()
        run: |
          echo "## Staging deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL**: ${{ steps.netlify_deploy.outputs.deploy_url }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.playwright.outcome }}" = "success" ]; then
            echo "- **Tests**: ✅ passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Tests**: ❌ failed — see the playwright-report artifact for details" >> "$GITHUB_STEP_SUMMARY"
          fi
