name: Deploy to Staging

# Every run builds the site once, then each test job serves that build on its
# own runner (http://localhost:3000) and tests it there, so test traffic never
# touches Netlify. Netlify is only deployed to after tests pass.
#
# push to staging      → build → core (@smoke + @core on chromium, Mobile
#                        Chrome, Mobile Safari) → deploy to Netlify if green →
#                        health-check the deployed site
# daily schedule       → build staging → full suite (4 shards), no deploy
# manual dispatch      → build the chosen branch → smoke, core or full, no deploy
#
# Scheduled runs only fire from this file's copy on the default branch (main)
# and check out main by default, hence the explicit `staging` ref on the
# schedule. Manual runs build and test whichever branch "Use workflow from" picks.
on:
  push:
    branches: ["staging"]
    paths-ignore: ["docs/**", "**.md"]
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC daily (3–4am Eastern)
  workflow_dispatch:
    inputs:
      suite:
        description: "smoke = @smoke on chromium + Mobile Chrome; core = @smoke + @core on chromium, Mobile Chrome, Mobile Safari; full = everything. Manual runs never deploy."
        type: choice
        options: [smoke, core, full]
        default: core

concurrency:
  group: staging-${{ github.event_name }}
  cancel-in-progress: true

env:
  SUITE: ${{ github.event_name == 'schedule' && 'full' || github.event_name == 'push' && 'core' || inputs.suite }}
  REF: ${{ github.event_name == 'schedule' && 'staging' || github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL_STAGING }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_STAGING }}

      - name: Save the build for the test and deploy jobs
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 3

  smoke:
    needs: build
    if: inputs.suite == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/

      - name: Serve the build on this runner
        run: |
          npx vite preview --port 3000 --strictPort > preview.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:3000/ > /dev/null && exit 0; sleep 1; done
          cat preview.log; exit 1

      - name: Run @smoke tests
        run: npx playwright test --grep @smoke --project=chromium --project="Mobile Chrome" --reporter=blob,list
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL_STAGING }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_STAGING }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_STAGING }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-smoke
          path: blob-report/
          retention-days: 14

  core:
    needs: build
    if: github.event_name == 'push' || inputs.suite == 'core'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/

      - name: Serve the build on this runner
        run: |
          npx vite preview --port 3000 --strictPort > preview.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:3000/ > /dev/null && exit 0; sleep 1; done
          cat preview.log; exit 1

      - name: Run @smoke + @core tests
        run: npx playwright test --grep "@smoke|@core" --project=chromium --project="Mobile Chrome" --project="Mobile Safari" --reporter=blob,list
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL_STAGING }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_STAGING }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_STAGING }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-core
          path: blob-report/
          retention-days: 14

  full:
    needs: build
    if: github.event_name == 'schedule' || inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/

      - name: Serve the build on this runner
        run: |
          npx vite preview --port 3000 --strictPort > preview.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:3000/ > /dev/null && exit 0; sleep 1; done
          cat preview.log; exit 1

      - name: Run full suite (shard ${{ matrix.shard }}/4)
        run: npx playwright test --reporter=blob,list --shard=${{ matrix.shard }}/4
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL_STAGING }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_STAGING }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_STAGING }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Upload blob report (shard ${{ matrix.shard }}/4)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 14

  deploy:
    needs: [build, core]
    if: github.event_name == 'push' && needs.core.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy_url: ${{ steps.netlify_deploy.outputs.deploy_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download the tested build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/

      - name: Deploy to Netlify
        id: netlify_deploy
        run: |
          npx netlify-cli deploy \
            --no-build \
            --dir=dist \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --prod \
            --json > netlify-deploy.json
          cat netlify-deploy.json
          DEPLOY_URL=$(node -e "console.log(require('./netlify-deploy.json').deploy_url || require('./netlify-deploy.json').url)")
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Install Chromium for the health check
        run: npx playwright install --with-deps chromium

      - name: Health-check the deployed site
        run: node scripts/check-site.js "${{ vars.STAGING_URL }}" dist/index.html

  report:
    needs: [build, smoke, core, full, deploy]
    if: always() && (needs.smoke.result != 'skipped' || needs.core.result != 'skipped' || needs.full.result != 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter=html ./all-blob-reports
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report

      - name: Upload merged Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Write summary
        env:
          RESULT: ${{ needs[env.SUITE].result }}
          DEPLOY: ${{ needs.deploy.result }}
          EVENT: ${{ github.event_name }}
          URL: ${{ vars.STAGING_URL }}
        run: |
          {
            echo "## Staging — $SUITE tests"
            echo ""
            if [ "$RESULT" = "success" ]; then
              echo "- **Tests**: ✅ passed"
            else
              echo "- **Tests**: ❌ $RESULT — see the playwright-report artifact for details"
            fi
            if [ "$EVENT" = "push" ]; then
              case "$DEPLOY" in
                success) echo "- **Deploy**: ✅ deployed and health-checked: $URL" ;;
                skipped) echo "- **Deploy**: ⏭ skipped because tests didn't pass — Netlify untouched" ;;
                *)       echo "- **Deploy**: ❌ $DEPLOY — see the deploy job's log" ;;
              esac
            else
              echo "- **Deploy**: — (only pushes to staging deploy)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
